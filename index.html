// Poses provisionales (salto, caida, golpe, herida) derivadas por código hasta recibir los dibujos propios.
const FSW = 168, FSH = 152, FOX_OX = 80, FOX_OY = 145, DRESS_X = 78;
const FR = (() => {
  const pal = TRN.pal.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return c; };
  function decode(f) {
    const c = mk(f.w, f.h), g = c.getContext('2d'), im = g.createImageData(f.w, f.h);
    for (let y = 0; y < f.h; y++) {
      const row = f.rle[y]; let x = 0, i = 0;
      while (i < row.length) {
        const ch = row[i++]; let n = '';
        while (i < row.length && row[i] >= '0' && row[i] <= '9') n += row[i++];
        const run = n ? parseInt(n, 10) : 1;
        if (ch !== '.') { const p = pal[TRN.ch.indexOf(ch)]; for (let k = 0; k < run; k++) { const o = (y * f.w + x + k) * 4; im.data[o] = p[0]; im.data[o + 1] = p[1]; im.data[o + 2] = p[2]; im.data[o + 3] = 255; } }
        x += run;
      }
    }
    g.putImageData(im, 0, 0); return c;
  }
  // coloca el dibujo en el lienzo común: vestido alineado en x, pies en la línea del suelo
  function place(name, dxs = 0, dys = 0) {
    const f = TRN.frames[name], c = mk(FSW, FSH), g = c.getContext('2d');
    const x0 = DRESS_X - Math.round(f.dx) + dxs, y0 = FOX_OY - f.h + dys;
    g.drawImage(decode(f), x0, y0);
    c.fist = f.fist ? [x0 + f.fist[0] - FOX_OX, y0 + f.fist[1] - FOX_OY] : null;
    return c;
  }
  // gira (sin suavizado) alrededor de los pies
  function rot(src, deg, w = FSW, h = FSH, px = FOX_OX, py = FOX_OY, dx = 0) {
    const c = mk(w, h), g = c.getContext('2d'); g.translate(px, py); g.rotate(deg * Math.PI / 180); g.drawImage(src, -FOX_OX + dx, -FOX_OY);
    if (src.fist) { const a = deg * Math.PI / 180, fx = src.fist[0] + dx, fy = src.fist[1]; c.fist = [fx * Math.cos(a) - fy * Math.sin(a), fx * Math.sin(a) + fy * Math.cos(a)]; c.fist[0] += px - FOX_OX; c.fist[1] += py - FOX_OY; }
    return c;
  }
  const shift = (src, dx, dy) => { const c = mk(FSW, FSH); c.getContext('2d').drawImage(src, dx, dy); if (src.fist) c.fist = [src.fist[0] + dx, src.fist[1] + dy]; return c; };

  const out = {};
  out.run = []; for (let i = 0; i < 8; i++) out.run.push(place('run' + i));
  const idleA = place('idle');
  const idleB = (() => {   // respiración: el torso baja 1 px
    const c = mk(FSW, FSH), g = c.getContext('2d'), cut = FOX_OY - 52;
    g.drawImage(idleA, 0, cut, FSW, FSH - cut, 0, cut, FSW, FSH - cut);
    g.drawImage(idleA, 0, 0, FSW, cut, 0, 1, FSW, cut); return c;
  })();
  // secuencia de quieta dibujada por la usuaria (29 cuadros: respira, mueve la cola y parpadea)
  out.idle = []; for (let i = 0; i < 29; i++) { const fr = TRN.frames['idleq' + i], c = mk(FSW, FSH); c.getContext('2d').drawImage(decode(fr), Math.round(DRESS_X - fr.ax), Math.round(FOX_OY - fr.gy)); c.fist = null; out.idle.push(c); }
  out.idleBlink = out.idle[0];
  // ---- provisionales ----
  out.jump = rot(shift(out.run[0], 0, -2), -4);
  out.fall = rot(shift(out.run[4], 0, -2), 5);
  const wind = shift(out.run[3], -5, 0), punch1 = shift(out.run[0], 26, 0), punch2 = shift(out.run[0], 15, 0);
  out.atkG = [wind, punch1, punch2];
  out.atkA = [wind, punch1, punch2];
  // al recibir un golpe abre el hocico: boca oscura con colmillos y lengua, mandíbula caída
  const idleOpen = (() => {
    const c = mk(FSW, FSH), g = c.getContext('2d'); g.drawImage(idleA, 0, 0);
    const jaw = mk(16, 5); jaw.getContext('2d').drawImage(idleA, 85, 47, 16, 5, 0, 0, 16, 5);
    g.fillStyle = '#2a0c10'; g.fillRect(89, 47, 12, 6); g.fillStyle = '#c8485c'; g.fillRect(91, 50, 6, 2);
    g.fillStyle = '#fff2cf'; g.fillRect(91, 47, 1, 2); g.fillRect(95, 47, 1, 2); g.fillRect(99, 47, 1, 1);
    g.drawImage(jaw, 84, 50); g.fillStyle = '#1c0b0b'; g.fillRect(89, 55, 10, 1);
    return c;
  })();
  out.idleOpen = idleOpen;
  // secuencia de muerte dibujada por la usuaria (17 cuadros); el primero (grito) sirve también de pose de herida
  out.dead = []; for (let i = 0; i < 17; i++) out.dead.push(decode(TRN.frames['dead' + i]));
  out.deadAx = TRN.frames.dead0.ax; out.deadGy = TRN.frames.dead0.gy;
  out.hurt = (() => { const c = mk(FSW, FSH), g = c.getContext('2d'); g.drawImage(out.dead[0], Math.round(DRESS_X - out.deadAx), Math.round(FOX_OY - out.deadGy)); c.fist = null; return c; })();
  out.deadBox = (() => {   // huella del cuerpo tendido (relativa al ancla), para la sangre y los robots
    const s = out.dead[16], d = s.getContext('2d').getImageData(0, 0, s.width, s.height).data; let x0 = 1e9, x1 = -1e9, y0 = 1e9;
    for (let y = 0; y < s.height; y++) for (let x = 0; x < s.width; x++) if (d[(y * s.width + x) * 4 + 3] > 0) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); }
    return { x0: Math.round(x0 - out.deadAx), x1: Math.round(x1 - out.deadAx), y0: Math.round(y0 - out.deadGy) };
  })();
  return out;
})();

const RW = 190, RH = 192, R_OX = 100, R_OY = 178;
const RC = { out: '#0a0806', st: '#59564f', stD: '#2f2c28', stL: '#8f8a7c', st2: '#413e38', rust: '#94501f', rustD: '#5c2e14', rustL: '#c47a35',
             hole: '#0c0a08', teeth: '#cdc3a4', wireR: '#c4281c', wireY: '#d8b02a', wireB: '#2f6fb5', lamp: '#a5321c', horn: '#6b6250', hornL: '#a89a7c' };
const STEEL = new Set([RC.st, RC.stD, RC.stL, RC.st2].map(c => hexRGB(c).join(',')));

function claws(S, hand, ang, spread, len) {
  part(S, RC.stD, g => circ(g, hand[0], hand[1], 6.2));
  layer(S, RC.stL, g => circ(g, hand[0] - 1.8, hand[1] - 1.8, 2.2), {});
  const n = 4;
  for (let i = 0; i < n; i++) {
    const a = ang + (i - (n - 1) / 2) * 0.34 * spread, L = len * (i === 0 || i === n - 1 ? 0.86 : 1);
    const ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
    const b = [hand[0] + ux * 4, hand[1] + uy * 4], m = [b[0] + ux * L * 0.55, b[1] + uy * L * 0.55];
    const a2 = a + 0.75, tip = [m[0] + Math.cos(a2) * L * 0.5, m[1] + Math.sin(a2) * L * 0.5];
    part(S, i % 2 ? RC.stL : '#a9a393', g => poly(g, [[b[0] + nx * 2.5, b[1] + ny * 2.5], [m[0] + nx * 1.7, m[1] + ny * 1.7], tip, [m[0] - nx * 1.7, m[1] - ny * 1.7], [b[0] - nx * 2.5, b[1] - ny * 2.5]]));
  }
}

function robotFrame(o) {
  const bigY = o.big ? 40 : 0, S = newSprite(RW, RH + bigY, R_OX, R_OY + bigY, RC.out);
  const b = o.bob || 0, L = (o.lean || 0) + 9, tilt = (o.tilt || 0) + 0.09, jaw = o.jaw == null ? 0.3 : o.jaw, hdy = (o.hy || 0) + 4;   // +9 / +0.09 / +4: postura encorvada, siempre bípeda

  const hc = [33 + L + (o.hx || 0), -125 + b + hdy];

    metal(back ? RC.stD : RC.stD, back ? RC.stD : RC.st2, g => limb(g, el, wr, 7.5, 5.5), 1.5, -1.5);

    layer(S, RC.wireR, g => stroke(g, [[el[0] - 1, el[1] + 3], [wr[0] - 1, wr[1] + 2]], 0.8), {});

      for (const k of [-1, 1]) part(S, RC.stD, g => circ(g, hand[0] - uy * k * 3 + ux * 3, hand[1] + ux * k * 3 + uy * 3, 3.4));

    metal(d1, d2, g => limb(g, hip, kn, 15, 10), 2, -1.5);                  // muslo
    if (ruin) {                                                             // espinilla expuesta: pistón y cables
      part(S, RC.hole, g => limb(g, kn, hock, 6.5, 5));
      layer(S, RC.stL, g => stroke(g, [[kn[0] + 1, kn[1] + 3], [hock[0] + 1, hock[1] - 2]], 1.6), {});
      layer(S, RC.wireR, g => stroke(g, [[kn[0] - 2, kn[1] + 3], [hock[0] - 2, hock[1] - 1]], 0.9), {});
      layer(S, RC.wireY, g => stroke(g, [[kn[0] + 3, kn[1] + 2], [hock[0] + 3, hock[1] - 3]], 0.8), {});
    } else metal(d1, d2, g => limb(g, kn, hock, 10, 7), 1.5, -1.5);       // espinilla
    part(S, RC.stD, g => circ(g, kn[0], kn[1], 6.2));                       // rodilla
    layer(S, RC.stL, g => circ(g, kn[0] - 1.5, kn[1] - 1.5, 2.2), {});
    metal(d1, back ? RC.stD : RC.st, g => limb(g, hock, [ft[0] - 2, ft[1] - 5], 7, 7.5), 1.5, -1.5);   // metatarso largo
    part(S, RC.stD, g => circ(g, hock[0], hock[1], 4.8));                  // talón
    // pezuña hendida
    const hf = g => { g.save(); g.translate(ft[0], ft[1]); g.rotate(rotH); poly(g, [[-6, -7], [7, -5], [14, 1], [13, 3.5], [-5, 3.5]]); g.restore(); };
    metal(RC.stD, back ? RC.stD : RC.st2, hf, 1.5, -1.5);
    layer(S, RC.hole, g => { g.save(); g.translate(ft[0], ft[1]); g.rotate(rotH); g.fillRect(5, -3, 1, 6); g.restore(); }, {});
  }
  leg(o.feet.f, true, false);

  // ----- cola/cable de la cadera -----
  if (!o.nocable) {   // cola larga de cocodrilo: placas de acero que se afinan hasta la punta
    const c = o.cable || 0, tp = [[hip[0] - 6, hip[1] - 3, 13], [hip[0] - 26 + c * 0.3, hip[1] + 2, 11], [hip[0] - 46 + c * 0.7, hip[1] + 11, 8.5], [hip[0] - 66 + c, hip[1] + 20, 6], [hip[0] - 84 + c * 1.3, hip[1] + 24, 3.6], [hip[0] - 99 + c * 1.6, hip[1] + 22, 1.4]];
    for (let i = 0; i < tp.length - 1; i++) { const a = tp[i], b2 = tp[i + 1]; metal(i % 2 ? RC.stD : RC.st2, i % 2 ? RC.st2 : RC.st, g => limb(g, [a[0], a[1]], [b2[0], b2[1]], a[2], b2[2]), 1.5, -1.5); }
    layer(S, RC.hole, g => { for (let i = 1; i < tp.length - 1; i++) g.fillRect(Math.round(tp[i][0]), Math.round(tp[i][1] - tp[i][2] / 2), 1, Math.round(tp[i][2])); }, {});
    layer(S, RC.stL, g => stroke(g, tp.slice(0, 5).map(q => [q[0], q[1] - q[2] * 0.3]), 1), {});
    part(S, RC.rustD, g => { for (let i = 0; i < tp.length - 2; i++) { const a = tp[i], b2 = tp[i + 1], mx = (a[0] + b2[0]) / 2, my = (a[1] + b2[1]) / 2 - (a[2] + b2[2]) / 4; poly(g, [[mx - 3, my + 1], [mx, my - 5], [mx + 3, my + 1]]); } });
    layer(S, RC.wireR, g => circ(g, tp[5][0] + 1, tp[5][1], 1), {});
  }

  leg(o.feet.n, false, true);

  // ----- torso: encorvado, flaco, con costillas a la vista -----
  const T = [[-15, -58], [-12, -78], [-6, -98], [8, -111], [25, -106], [28, -90], [15, -72], [7, -56]].map(([x, y]) => [x + fx(y), y + b]);
  const torso = g => poly(g, T);
  metal(RC.stD, RC.st, torso, 3, -2.5);
  const cav = g => poly(g, [[0 + fx(-92), -96 + b], [16 + fx(-100), -100 + b], [22 + fx(-86), -84 + b], [14 + fx(-72), -70 + b], [2 + fx(-74), -74 + b]]);
  part(S, RC.hole, cav);
  layer(S, RC.stL, g => { for (let k = 0; k < 4; k++) { const y = -95 + k * 6 + b, x = 3 + k * 1.5 + fx(-y); g.save(); g.translate(x, y); g.rotate(0.35); g.fillRect(0, 0, 16 - k, 2); g.restore(); } }, { clip: cav });
  layer(S, RC.wireR, g => stroke(g, [[6 + fx(-92), -94 + b], [10 + fx(-82), -86 + b], [7 + fx(-76), -76 + b]], 1), { clip: cav });
  layer(S, RC.wireB, g => stroke(g, [[17 + fx(-96), -96 + b], [16 + fx(-86), -84 + b], [18 + fx(-76), -76 + b]], 1), { clip: cav });
  part(S, RC.lamp, g => circ(g, 12 + fx(-84), -83 + b, 2.8));
  layer(S, '#ff7a4a', g => g.fillRect(Math.round(11 + fx(-84)), Math.round(-84 + b), 1, 1), {});
  // espina dorsal expuesta
  layer(S, RC.stL, g => { for (let k = 0; k < 6; k++) { const y = -102 + k * 8 + b; g.fillRect(Math.round(-11 + fx(-y) - k * 0.7), Math.round(y), 3, 2); } }, {});
  layer(S, RC.hole, g => { stroke(g, [[-8 + fx(-96), -94 + b], [-5 + fx(-88), -88 + b], [-9 + fx(-82), -80 + b]], 1); circ(g, 2 + fx(-66), -64 + b, 2), circ(g, -6 + fx(-90), -90 + b, 1.6); }, { clip: torso });
  // hombrera de acero oxidada con picos
  metal(RC.rustD, RC.rust, g => ell(g, sh[0] - 1, sh[1] - 3, 9, 7, -0.35), 2, -2);
  part(S, RC.rustD, g => poly(g, [[sh[0] - 6, sh[1] - 7], [sh[0] - 3, sh[1] - 20], [sh[0] + 2, sh[1] - 8]]));
  part(S, RC.rustD, g => poly(g, [[sh[0] + 2, sh[1] - 8], [sh[0] + 10, sh[1] - 16], [sh[0] + 9, sh[1] - 5]]));

  // ----- cuello y cabeza de cabra -----
  const cx = hc[0], cy = hc[1];
  const rot = (g, fn) => { g.save(); g.translate(cx, cy); g.rotate(tilt); fn(g); g.restore(); };
  part(S, RC.stD, g => limb(g, [sh[0] + 2, sh[1] - 4], [cx - 5, cy + 9], 10, 8));
  layer(S, RC.wireR, g => stroke(g, [[sh[0] + 4, sh[1] - 6], [cx - 2, cy + 10]], 0.9), {});
  layer(S, RC.stL, g => { for (let k = 0; k < 3; k++) { const t = 0.2 + k * 0.28; g.fillRect(Math.round(lerp(sh[0] + 2, cx - 5, t) - 4), Math.round(lerp(sh[1] - 4, cy + 9, t)), 8, 1); } }, {});
  // cuerno lejano (oscuro) y orejas
  part(S, RC.stD, g => rot(g, h => { limb(h, [-3, -11], [-10, -24], 6, 4); limb(h, [-10, -24], [-20, -30], 4, 2.4); }));
  // oreja metálica caída
  metal(RC.st2, RC.st, g => rot(g, h => poly(h, [[-4, -7], [-24, -3], [-30, 6], [-14, 3], [-4, 1]])), 1.5, -1.5);
  layer(S, RC.hole, g => rot(g, h => poly(h, [[-9, -3], [-19, -1], [-22, 3], [-12, 1]])), {});
  // cráneo alargado (hocico de cabra)
  const skull = g => rot(g, h => poly(h, [[-11, -9], [0, -13.5], [9, -12.5], [17, -8.5], [25, -4.5], [32, -1.5], [37, 1], [38.5, 3.5], [36.5, 5.5], [30, 6.5], [20, 7.5], [6, 8], [-9, 7], [-13, -1]]));
  metal(RC.stD, RC.st, skull, 3, -2.5);
  // mandíbula inferior floja
  const jawShape = g => rot(g, h => { h.save(); h.translate(-4, 7); h.rotate(jaw * 0.5); poly(h, [[0, 0], [27, 0], [34, 1.5], [35, 3.2], [29, 5], [19, 6.2], [4, 6]]); h.restore(); });
  metal(RC.st2, RC.st, jawShape, 1.5, -1.5);
  const jawFang = (k) => g => rot(g, h => { h.save(); h.translate(-4, 7); h.rotate(jaw * 0.5); poly(h, [[11 + k * 4.5, 0], [14 + k * 4.5, 0], [12.4 + k * 4.5, -4 - (k % 2) * 1.5]]); h.restore(); });
  for (let k = 0; k < 4; k++) if (k !== 2) layer(S, RC.teeth, jawFang(k), {});
  layer(S, RC.teeth, g => rot(g, h => { for (let k = 0; k < 5; k++) { const x = 10 + k * 4.8, y0 = 7.6 - k * 0.15, L2 = k === 3 ? 9 : 4.6 + (k % 2); poly(h, [[x, y0], [x + 3, y0 - 0.2], [x + 1.6, y0 + L2]]); } }), {});
  // nariz, mejilla y grieta
  layer(S, RC.hole, g => rot(g, h => { circ(h, 36, 2.6, 2.3); stroke(h, [[-8, -3], [-3, 2], [-6, 6]], 0.9); h.fillRect(11, 4, 8, 1); h.fillRect(11, 6, 6, 1); }), { clip: skull });
  layer(S, RC.stL, g => rot(g, h => stroke(h, [[4, -11], [18, -7], [32, -0.5]], 1)), { clip: skull });
  // ceja dura y cuenca del ojo
  part(S, RC.hole, g => rot(g, h => poly(h, [[5, -7], [16, -3.5], [14.5, -0.5], [5, -3]])));
  part(S, RC.rustD, g => rot(g, h => poly(h, [[2, -11], [19, -6], [18, -4], [14, -5.5], [3, -8]])));
  layer(S, RC.rust, g => rot(g, h => poly(h, [[4, -11], [16, -7.2], [10, -7.6], [4, -9]])), {});
  // cuerno cercano: curvo con anillos, el extremo roto
  const horn = g => rot(g, h => { limb(h, [2, -13], [-4, -24], 8, 6); limb(h, [-4, -24], [-15, -30], 6, 4.2); limb(h, [-15, -30], [-26, -27], 4.2, 2.4); });
  metal(RC.horn, RC.hornL, horn, 1.5, -1.5);
  layer(S, RC.hole, g => rot(g, h => { for (const [x, y] of [[-3, -20], [-9, -27], [-17, -28.5]]) h.fillRect(x, y, 1, 4); }), { clip: horn });
  layer(S, RC.wireY, g => rot(g, h => stroke(h, [[-26, -27], [-29, -24]], 0.9)), {});
  // barba de cables
  layer(S, RC.hole, g => rot(g, h => { stroke(h, [[18, 10], [16, 16 + jaw * 3], [18, 22 + jaw * 3]], 1.4); stroke(h, [[12, 10], [8, 17 + jaw * 3]], 1.2); }), {});
  layer(S, RC.wireR, g => rot(g, h => circ(h, 18, 23 + jaw * 3, 0.9)), {});

  // ----- brazo cercano (garras largas) -----
  arm(o.arms.n, false);

  // ojo (posición para el brillo) y mano
  S.c.eye = [cx + Math.cos(tilt) * 10 - Math.sin(tilt) * -4, cy + Math.sin(tilt) * 10 + Math.cos(tilt) * -4];
  S.c.claw = [o.arms.n[0], o.arms.n[1]]; S.c.oy = R_OY + bigY;
  weather(S);
  return S.c;
}

// envejecimiento: óxido en manchas y chorreados, rayones y suciedad sobre el acero
function weather(S) {
  const g = S.g, id = g.getImageData(0, 0, S.w, S.h), d = id.data, W2 = S.w;
  const rustC = [hexRGB(RC.rustD), hexRGB(RC.rust), hexRGB(RC.rustL)];
  for (let y = 0; y < S.h; y++) for (let x = 0; x < W2; x++) {
    const k = (y * W2 + x) * 4; if (d[k + 3] === 0) continue;
    const key = d[k] + ',' + d[k + 1] + ',' + d[k + 2]; if (!STEEL.has(key)) continue;
    const n = fbm(x / 6 + 11, y / 6) + vnoise(x / 2.5, y / 15 + 7) * 0.35 + bayer(x, y) * 0.16;
    if (n > 0.92) { const c = rustC[n > 1.08 ? 2 : (n > 1.0 ? 1 : 0)]; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; }
    else if (hash(x, y * 3) > 0.985) { d[k] = Math.min(255, d[k] + 38); d[k + 1] = Math.min(255, d[k + 1] + 38); d[k + 2] = Math.min(255, d[k + 2] + 42); }
    else if (n < 0.34) { d[k] = (d[k] * 0.72) | 0; d[k + 1] = (d[k + 1] * 0.72) | 0; d[k + 2] = (d[k + 2] * 0.74) | 0; }
  }
  g.putImageData(id, 0, 0);
}

const SUN = { x: 470, y: 150, r: 38 };
const sky = mk(W, H);
{
  const g = sky.getContext('2d'), id = g.createImageData(W, H), d = id.data;
  const stops = [[0, [34, 30, 20]], [0.3, [66, 56, 32]], [0.58, [112, 90, 46]], [0.85, [156, 124, 62]], [1, [176, 142, 74]]];
  const lv = 13;
  for (let y = 0; y < H; y++) {
    const t = y / (H * 0.8);
    let c = stops[stops.length - 1][1];
    for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { c = mix(stops[i - 1][1], stops[i][1], (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0])); break; }

      cc = mix(cc, [226, 200, 140], Math.pow(glow, 4) * 0.55);
      if (dist <= SUN.r) { const f = dist / SUN.r; cc = mix([238, 222, 168], [208, 178, 108], f * f); cc = mix(cc, [150, 122, 66], clamp((x - SUN.x) / SUN.r * 0.12 + 0.1 + fbm(x / 7, y / 7) * 0.25 - 0.15, 0, 0.5)); }

  const btn = (r, label, col, border) => {
    ctx.fillStyle = 'rgba(10,7,4,0.74)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.font = 'bold 11px monospace'; ctx.fillStyle = col; ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
  };
  if (IS_TOUCH) btn(PAUSE_BTN, paused ? '▶ SEGUIR' : 'II PAUSA', paused ? '#9fffb0' : '#e8dcc0', paused ? '#4a8a5a' : '#6a5c40');
  ctx.restore(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function drawToolsUI() {
  ctx.save(); ctx.textAlign = 'center';
  if (!toolsOpen) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, 22);
    ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#e8dcc0'; ctx.fillText('MAPA COMPLETO (en vivo) · V: cámara normal · H: menú', W / 2, 15);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(14,10,6,0.95)'; ctx.fillRect(130, 120, 380, 250); ctx.strokeStyle = '#6a5c40'; ctx.lineWidth = 2; ctx.strokeRect(130, 120, 380, 250);
    ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#d8c9a0'; ctx.fillText('HERRAMIENTAS', W / 2, 156);
    const T = TOOLS();
    for (let i = 0; i < 4; i++) {
      const r = toolRect(i), on = i === toolsSel;
      ctx.fillStyle = on ? 'rgba(176,35,26,0.6)' : 'rgba(60,50,34,0.5)'; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.font = 'bold 14px monospace'; ctx.fillStyle = on ? '#fff0d0' : '#b8a880'; ctx.fillText((i + 1) + '. ' + T[i], W / 2, r.y + 21);
    }
    ctx.font = '11px monospace'; ctx.fillStyle = '#8a7c5a'; ctx.fillText('clic en una opción · o ↑ ↓ y Enter · H / Esc cerrar', W / 2, 358);
  }
  ctx.restore();
}
function drawPauseScreen() {
  ctx.save(); ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(4,2,8,0.66)'; ctx.fillRect(0, 0, W, H);
  ctx.font = 'bold 40px monospace'; ctx.fillStyle = '#000'; ctx.fillText('PAUSA', W / 2 + 2, H / 2 - 18);
  ctx.fillStyle = '#e8dcc0'; ctx.fillText('PAUSA', W / 2, H / 2 - 20);
  ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#b8a880'; ctx.fillText('P o Esc para seguir', W / 2, H / 2 + 20);
  ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#8f8470'; ctx.fillText(IS_TOUCH ? 'o toca SEGUIR' : 'H abre el menú de herramientas', W / 2, H / 2 + 44);
  ctx.restore(); ctx.textAlign = 'left';
}

// =====================================================================
//  BUCLE PRINCIPAL (60 pasos por segundo, en cualquier monitor)
// =====================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { fxTick(); if (!started) { state.t++; ambientTick(); } else if (paused || toolsOpen) { /* congelado: solo se dibuja */ } else if (state.hitstop > 0) state.hitstop--; else update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// =====================================================================
//  CONTROLES TÁCTILES (solo aparecen en pantallas táctiles; en PC no cambian nada)
// =====================================================================
(function () {
  const css = document.createElement('style');
  css.textContent = 'html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}' +
    '#tc{display:none}#tc.on{display:block}' +
    '#tc .b{position:fixed;width:var(--s);height:var(--s);border-radius:50%;background:rgba(20,12,18,.55);border:2px solid rgba(216,201,160,.55);color:#e8dcc0;font:bold calc(var(--s)*.42) monospace;display:flex;align-items:center;justify-content:center;touch-action:none;box-sizing:border-box;text-shadow:1px 1px 0 #000}' +
    '#tc .b.d{background:rgba(160,40,30,.7);border-color:#ffb090}' +
    '#tc{--s:clamp(54px,17vmin,92px);--g:3vmin}' +
    '#tc [data-k=L]{left:var(--g);bottom:var(--g)}#tc [data-k=R]{left:calc(var(--g) + var(--s)*1.25);bottom:var(--g)}' +
    '#tc [data-k=J]{right:var(--g);bottom:var(--g)}#tc [data-k=A]{right:calc(var(--g) + var(--s)*1.25);bottom:var(--g);background:rgba(40,70,120,.6)}' +
    '#tc [data-k=H]{right:calc(var(--g) + var(--s)*.62);bottom:calc(var(--g) + var(--s)*1.25)}' +
    '#tc [data-k=M]{right:var(--g);top:var(--g);width:calc(var(--s)*.5);height:calc(var(--s)*.5);font-size:calc(var(--s)*.26)}';
  document.head.appendChild(css);
  const root = document.createElement('div'); root.id = 'tc';
  for (const [k, t] of [['L', '◀'], ['R', '▶'], ['A', '⚡'], ['J', '▲'], ['H', '▼'], ['M', '♪']]) { const b = document.createElement('div'); b.className = 'b'; b.dataset.k = k; b.textContent = t; root.appendChild(b); }
  document.body.appendChild(root);
  const show = () => { IS_TOUCH = true; root.classList.add('on'); };
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) show();
  const held = new Map();   // id del dedo -> botón
  const apply = () => {
    const s = new Set(held.values());
    keys.ArrowLeft = s.has('L'); keys.ArrowRight = s.has('R'); keys.ArrowDown = s.has('H');
    keys.Space = s.has('J');
    for (const b of root.children) b.classList.toggle('d', s.has(b.dataset.k));
  };
  const hit = t => { const el = document.elementFromPoint(t.clientX, t.clientY); return el && el.dataset && el.dataset.k ? el.dataset.k : null; };
  const resume = () => { if (!paused && AC && AC.state === 'suspended') AC.resume(); };
  const down = (id, k) => {
    if (held.get(id) === k) return;
    held.set(id, k);
    if (k === 'J') jumpPressed = true;
    if (k === 'A') atkPressed = true;
    if (k === 'M' && AC) { muted = !muted; master.gain.value = muted ? 0 : 0.7; }
  };
  const onTouch = e => {
    show(); if (e.cancelable) e.preventDefault();
    if (!started) return;
    for (const t of e.changedTouches) { const k = hit(t); if (k) down(t.identifier, k); else held.delete(t.identifier); }
    apply();
  };
  addEventListener('touchstart', onTouch, { passive: false });
  addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); if (!started) return; for (const t of e.changedTouches) { const k = hit(t); if (k) down(t.identifier, k); else held.delete(t.identifier); } apply(); }, { passive: false });
  const end = e => {
    if (e.cancelable) e.preventDefault();
    for (const t of e.changedTouches) held.delete(t.identifier);
    apply(); resume();
    // empezar / reintentar tocando la pantalla
    if (e.type === 'touchend' && e.changedTouches.length) {
      const t = e.changedTouches[0];
      if (!started) { const p = mousePos(t); if (inBtn(p)) { startGame(); try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} } }
      else {
        const p = mousePos(t);
        if (inRect(p, PAUSE_BTN)) togglePause();
        else if (!hit(t)) {
          if (pl.dead && pl.deadT > 60) restartPressed = true;
          else if (!pl.dead && state.winT > 150) restartPressed = true;
        }
      }
    }
  };
  addEventListener('touchend', end, { passive: false });
  addEventListener('touchcancel', end, { passive: false });
  addEventListener('contextmenu', e => e.preventDefault());
})();

</script>
